[project]
name = "capstone"
version = "0.1.0"
description = "Reproducible Berlin neighborhood temperature and historical-context pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagster==1.13.15",
    "dagster-dg-cli>=1.13.15",
    "dagster-webserver==1.13.15",
    "eccodes<2.45",
    "geopandas>=1.1.4",
    "netcdf4>=1.7.4",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.4",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]
[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "src"
code_location_target_module = "src.dagster_pipeline.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration and not acceptance and not historical_rebuild"]
markers = [
    "integration: requires an initialized PostgreSQL/PostGIS database",
    "acceptance: requires fully materialized static inputs and HOSTRADA references",
    "historical_rebuild: exercises the optional HOSTRADA reconstruction workflow",
    "contract: protects an important pipeline, data, or serving contract",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
]

[tool.ruff.lint]
# Only this rule is enforced for now; the default rule set reports existing
# findings in code that predates ruff in this repository.
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = """Do not use `from __future__ import annotations`: Dagster reads \
annotations at runtime (see docs/runbook.md), and Python 3.11+ supports the syntax natively."""
